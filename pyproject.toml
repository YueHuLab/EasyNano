[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easynano"
version = "1.0.0"
description = "Epitope-targeted nanobody CDR design with ESMFold2 differentiable distogram optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}

authors = [
  {name = "YueHuLab"},
]

# Runtime dependencies that are cleanly installable from PyPI.
#
# NOTE — `esmscore` is intentionally NOT listed here. It is an internal module
# of EvolutionaryScale's ESM that is NOT published to PyPI (and is absent from
# the current `esm` PyPI package). Listing it would make `pip install -e .`
# fail. The `design` / `eval` / `baseline` commands import `esmscore` *inside*
# the function body, so they are the only ones that need it — and only after
# the user has made `esmscore` importable in their environment (see README).
#
# `transformers` on PyPI (>=4.5x) already ships `transformers.models.esmfold2`,
# so the Biohub transformers fork is NOT required.
dependencies = [
  "torch>=2.2.0",
  "biotite>=1.0.0",
  "abnumber",
  "logomaker",
  "pandas",
  "numpy",
  "matplotlib",
  "seaborn",
  "transformers>=4.45",
]

[project.optional-dependencies]
# Heavy / GPU-only extras. Not required for install or the simple test.
# `esmscore` cannot be pinned here (not on PyPI); install it separately per
# the README "Full pipeline prerequisites" section.
design = [
  "transformers>=4.45",
]

[project.scripts]
easynano = "easynano.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["easynano*"]
