[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easynano"
version = "2.0.0"
description = "Epitope-targeted nanobody CDR design with ESMFold2 differentiable distogram optimization (esmscore vendored)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [
  {name = "YueHuLab"},
]
# All runtime deps are public. `esmscore` is vendored into this repo as a
# top-level `esmscore/` package, so `pip install -e .` makes `import esmscore`
# work out of the box — no separate install, no sys.path hack.
#
# IMPORTANT — the ESMFold2 model code:
# `transformers.models.esmfold2` (ESMFold2Config / ESMFold2Model /
# gather_rep_atom_coords / protein_utils) is NOT in the standard HuggingFace
# `transformers` PyPI package. It is provided by the PUBLIC Biohub fork of
# transformers at github.com/Biohub/transformers (commit 3a8956f, the same
# pin used by EvolutionaryScale's own `esm` package). We depend on that fork
# directly so any user gets a working `easynano design` after `pip install -e .`.
# Standard PyPI `transformers` (4.x or 5.x) does NOT ship esmfold2, and the
# PyPI `esm` package's `esm.models.esmfold2` uses a different (camelCase)
# API that esmscore is not written against.
dependencies = [
  # Biohub transformers fork — provides transformers.models.esmfold2
  "transformers @ git+https://github.com/Biohub/transformers.git@3a8956fb4d4ea16b0ec8e71deef2c2909b6a5cbf",
  "torch>=2.2.0",
  "biotite>=1.0.0",
  "abnumber",
  "logomaker",
  "pandas",
  "numpy",
  "matplotlib",
  "seaborn",
]

[project.scripts]
easynano = "easynano.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["easynano*", "esmscore*"]
